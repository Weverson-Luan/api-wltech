# PostgreSQL para desenvolvimento e migrations (veja README).
services:
  postgres:
    image: postgres:16-alpine
    container_name: api-wltech-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: wltech
      POSTGRES_PASSWORD: wltech
      POSTGRES_DB: wltech
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wltech -d wltech']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
