# Nginx reverse proxy — API WLTech (api.wltech.tech)
#
# Instalação na VPS:
#   1. sudo cp deploy/nginx/api-wltech.conf /etc/nginx/sites-available/api-wltech
#   2. sudo ln -sf /etc/nginx/sites-available/api-wltech /etc/nginx/sites-enabled/
#   3. Emita o certificado com Certbot (ver docs/DEPLOY.md Parte 8)
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# A API Docker escuta apenas em 127.0.0.1:13333 (não publique 13333 no UFW).

upstream api_wltech {
    server 127.0.0.1:13333;
    keepalive 32;
}

# HTTP → HTTPS (ACME challenge permanece acessível na porta 80)
server {
    listen 80;
    listen [::]:80;
    server_name api.wltech.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.wltech.tech;

    # Caminhos gerados pelo Certbot (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/api.wltech.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wltech.tech/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # API JSON — bodies grandes só se você precisar (uploads, etc.)
    client_max_body_size 10m;

    location / {
        proxy_pass http://api_wltech;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
